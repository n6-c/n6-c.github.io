name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # publish only the built site: no tools/, README or anything else in the repo
      - name: Collect the public files
        run: |
          mkdir _site _site/brand
          cp -R *.html en pt assets demos midia CNAME robots.txt sitemap.xml _site/
          cp brand/og.png brand/og-en.png brand/n6c-mark.png brand/founder.jpg _site/brand/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
